<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — PastVault</title>
<link rel="stylesheet" href="register.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-stamp">NEW ACCOUNT</div>

    <div class="brand-row">
      <span class="brand-icon">
        <svg width="30" height="30" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="30" height="30" rx="9" fill="#0D9488"/>
          <circle cx="16" cy="16" r="7.5" fill="none" stroke="#FFFBF5" stroke-width="2.2"/>
          <circle cx="16" cy="16" r="2.4" fill="#F97316"/>
          <rect x="15" y="7.3" width="2" height="3.4" rx="1" fill="#FFFBF5"/>
        </svg>
      </span>
      <span class="brand-word">PastVault</span>
    </div>

    <h1>Create your account</h1>
    <p class="auth-sub">Register once to browse and share verified past questions.</p>

    <div class="auth-error" id="errorBox"></div>
    <div class="auth-success" id="successBox" role="status"></div>

    <form id="registerForm">
      <div class="field">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName" required placeholder="e.g. Chinedu Okafor">
      </div>
      <div class="field">
        <label for="regNumber">Matric number</label>
        <input type="text" id="regNumber" required placeholder="e.g. DTA/2026/014">
      </div>
      <div class="field">
        <label for="departmentCombo">Department</label>
        <div id="departmentCombo"></div>
        <p id="noDeptNote" style="display:none; font-size:12px; color:#B23A29; margin-top:8px;">
          No departments have been set up yet ask your admin to create one first.
        </p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password">
            <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" required minlength="6">
          <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password">
            <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Register</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="auth.js"></script>
<script src="departments.js"></script>
<script src="combo.js"></script>
<script src="password-toggle.js"></script>
<script>
  const form = document.getElementById("registerForm");
  const errorBox = document.getElementById("errorBox");
  const successBox = document.getElementById("successBox");

  const deptCombo = new SearchableSelect(document.getElementById("departmentCombo"), {
    placeholder: "Type to search your department"
  });

  async function loadDepartments() {
    try {
      const departments = await getDepartmentOptions();
      if (departments.length === 0) {
        document.getElementById("noDeptNote").style.display = "block";
        deptCombo.disable("No departments yet");
        document.getElementById("submitBtn").disabled = true;
      } else {
        deptCombo.setOptions(departments.map(d => ({ value: d.id, label: d.name })));
      }
    } catch (error) {
      showError(errorBox, error.message || "Could not load departments from Supabase.");
      document.getElementById("submitBtn").disabled = true;
    }
  }
  loadDepartments();

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errorBox.classList.remove("show");
    successBox.classList.remove("show");

    const fullName = document.getElementById("fullName").value.trim();
    const regNumber = document.getElementById("regNumber").value.trim();
    const departmentId = deptCombo.getValue();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (!departmentId) {
      showError(errorBox, "Please select your department.");
      return;
    }

    if (password !== confirmPassword) {
      showError(errorBox, "Passwords do not match.");
      return;
    }

    document.getElementById("submitBtn").disabled = true;
    try {
      const result = await registerUser({ fullName, regNumber, email, password, department: departmentId });
      if (!result.ok) {
        showError(errorBox, result.message);
        document.getElementById("submitBtn").disabled = false;
        return;
      }

      if (result.needsEmailConfirmation) {
        showError(errorBox, "Supabase is still requiring email confirmation. In your Supabase dashboard, turn off Authentication → Providers → Email → Confirm email, then register again.");
        document.getElementById("submitBtn").disabled = false;
        return;
      }

      window.location.href = "dashboard.html";
    } catch (error) {
      showError(errorBox, error.message || "Could not connect to Supabase.");
      document.getElementById("submitBtn").disabled = false;
    }
  });
</script>

</body>
</html>
